function normaliza(s) {
  return (s || '')
    .toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // saca acentos
    .toLowerCase()
    .replace(/[|\-_.,;:()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function stripExt(fn) {
  return fn.replace(/\.[a-zA-Z0-9]{2,4}$/, '');
}

function cloudUrl(filename) {
  const noExt = stripExt(filename);
  return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${FOLDER}/${encodeURIComponent(noExt)}`;
}

const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

let ROWS = []; // { docId, nombreFirestore, matchedNombreSQL, filename, url, status, imgOk }

function buildSqlIndex() {
  const idx = new Map();
  CAT_SQL.forEach(r => {
    const key = normaliza(r.nombre);
    if (!idx.has(key)) idx.set(key, []);
    idx.get(key).push(r);
  });
  return idx;
}

document.getElementById('btnLoad').addEventListener('click', async () => {
  document.getElementById('btnLoad').disabled = true;
  log('Leyendo colección "categorias" de Firestore...');
  const snap = await getDocs(collection(db, 'categorias'));
  const cats = snap.docs.map(d => ({ id: d.id, nombre: d.data().nombre || '', logo_url: d.data().logo_url || '' }));
  log(`Encontradas ${cats.length} categorías en Firestore.`);
  log(`Cargadas ${CAT_SQL.length} categorías del SQL viejo (con imagen).`);

  const sqlIdx = buildSqlIndex();
  ROWS = cats.map(c => {
    const key = normaliza(c.nombre);
    const candidates = sqlIdx.get(key);
    let filename = '';
    let matched = '';
    let status = 'warn';
    if (candidates && candidates.length >= 1) {
      filename = candidates[0].filename;
      matched = candidates[0].nombre;
      status = 'ok';
    }
    return {
      docId: c.id,
      nombreFirestore: c.nombre,
      yaCargado: c.logo_url,
      matchedNombreSQL: matched,
      filename,
      url: filename ? cloudUrl(filename) : '',
      status,
      imgOk: null
    };
  });

  render();
  document.getElementById('filters').style.display = 'block';
  document.getElementById('btnApply').disabled = false;
  document.getElementById('btnRecheck').disabled = false;
});

function updateStats() {
  const ok = ROWS.filter(r => r.status === 'ok').length;
  const warn = ROWS.filter(r => r.status === 'warn').length;
  const broken = ROWS.filter(r => r.imgOk === false).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${ROWS.length}</b>Total categorías</div>
    <div class="stat"><b>${ok}</b>✅ Con match</div>
    <div class="stat"><b>${warn}</b>⚠️ Sin match</div>
    <div class="stat"><b style="color:#fca5a5">${broken}</b>❌ Imagen rota (chequeadas)</div>
  `;
}

function render() {
  updateStats();
  const fOk = document.getElementById('fOk').checked;
  const fWarn = document.getElementById('fWarn').checked;
  const fBroken = document.getElementById('fBroken').checked;

  const wrap = document.getElementById('wrap');
  let html = `<table><thead><tr>
    <th>Aplicar</th><th>Preview</th><th>Categoría (Firestore)</th><th>Match SQL</th><th>Archivo (editable)</th><th>Estado</th>
  </tr></thead><tbody>`;

  ROWS.forEach((r, i) => {
    const rowClass = r.imgOk === false ? 'broken' : (r.status === 'ok' ? 'ok' : 'warn');
    if (rowClass === 'ok' && !fOk) return;
    if (rowClass === 'warn' && !fWarn) return;
    if (rowClass === 'broken' && !fBroken) return;

    const badge = r.imgOk === false
      ? '<span class="badge broken">❌ rota</span>'
      : (r.status === 'ok' ? '<span class="badge ok">✅ match</span>' : '<span class="badge warn">⚠️ sin match</span>');

    html += `<tr class="${rowClass}" data-idx="${i}">
      <td><input type="checkbox" class="chkApply" ${r.filename ? 'checked' : ''}></td>
      <td>${r.url ? `<img class="prev" src="${r.url}" data-idx="${i}">` : ''}</td>
      <td>${r.nombreFirestore}${r.yaCargado ? ' <span style="color:#64748b">(ya tiene logo)</span>' : ''}</td>
      <td style="color:#94a3b8">${r.matchedNombreSQL || '-'}</td>
      <td><input type="text" class="fname" data-idx="${i}" value="${r.filename || ''}" placeholder="nombre-archivo.jpg"></td>
      <td>${badge}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('img.prev').forEach(img => {
    img.addEventListener('error', () => {
      const i = +img.dataset.idx;
      ROWS[i].imgOk = false;
      img.closest('tr').classList.add('broken');
      img.closest('tr').classList.remove('ok','warn');
      updateStats();
    });
    img.addEventListener('load', () => {
      const i = +img.dataset.idx;
      ROWS[i].imgOk = true;
    });
  });

  wrap.querySelectorAll('input.fname').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = +inp.dataset.idx;
      ROWS[i].filename = inp.value.trim();
      ROWS[i].url = ROWS[i].filename ? cloudUrl(ROWS[i].filename) : '';
      ROWS[i].imgOk = null;
      render();
    });
  });
}

['fOk','fWarn','fBroken'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('btnRecheck').addEventListener('click', render);

document.getElementById('btnApply').addEventListener('click', async () => {
  const wrap = document.getElementById('wrap');
  const checks = wrap.querySelectorAll('.chkApply');
  const toApply = [];
  checks.forEach(chk => {
    const i = +chk.closest('tr').dataset.idx;
    if (chk.checked && ROWS[i].filename && ROWS[i].imgOk !== false) {
      toApply.push(ROWS[i]);
    }
  });

  if (toApply.length === 0) {
    log('No hay filas marcadas y con imagen válida para aplicar.');
    return;
  }
  if (!confirm(`Vas a actualizar logo_url en ${toApply.length} categorías de Firestore. ¿Confirmás?`)) return;

  document.getElementById('btnApply').disabled = true;
  let done = 0, errors = 0;
  for (const r of toApply) {
    try {
      await updateDoc(doc(db, 'categorias', r.docId), { logo_url: r.url });
      done++;
      if (done % 20 === 0) log(`Actualizadas ${done}/${toApply.length}...`);
    } catch (e) {
      errors++;
      log(`Error en "${r.nombreFirestore}": ${e.message}`);
    }
  }
  log(`Listo. ${done} categorías actualizadas. ${errors} errores.`);
  document.getElementById('btnApply').disabled = false;
  alert(`Listo: ${done} logos vinculados. ${errors} errores (ver log).`);
});
</script>
