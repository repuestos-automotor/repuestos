<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Configurar Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080b12;color:#e2e8f0;font-family:'Inter',sans-serif;padding:30px;min-height:100vh}
h1{font-size:18px;color:#60a5fa;margin-bottom:8px}
p{font-size:12px;color:#4b5563;margin-bottom:24px}
.card{background:#0f1117;border:1px solid #1e2433;border-radius:12px;padding:20px;max-width:480px}
.form-group{margin-bottom:14px}
label{font-size:11px;color:#94a3b8;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;background:#141720;border:1px solid #2a3347;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:13px;font-family:'Inter',sans-serif;outline:none}
input:focus{border-color:#2563eb}
.btn{background:#2563eb;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;font-family:'Inter',sans-serif;margin-top:4px}
.btn:hover{background:#1d4ed8}
.log{background:#141720;border:1px solid #1e2433;border-radius:8px;padding:14px;font-size:12px;font-family:monospace;line-height:2;margin-top:16px;min-height:60px}
.ok{color:#22c55e}.err{color:#ef4444}.info{color:#60a5fa}
.tip{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:10px 12px;font-size:11.5px;color:#f59e0b;margin-bottom:16px}
</style>
</head>
<body>
<h1>⚡ Configurar cuenta administrador</h1>
<p>Ejecutar una sola vez para darle rol de admin a tu cuenta</p>

<div class="tip">
  📌 Para encontrar tu UID: Firebase Console → Authentication → Users → copiá el ID largo de tu usuario
</div>

<div class="card">
  <div class="form-group">
    <label>Tu UID de Firebase Authentication</label>
    <input type="text" id="uid-input" placeholder="Ej: abc123XYZ789defghijk...">
  </div>
  <div class="form-group">
    <label>Tu nombre completo</label>
    <input type="text" id="nombre-input" placeholder="Ej: Juan García">
  </div>
  <div class="form-group">
    <label>Tu email</label>
    <input type="email" id="email-input" placeholder="tu@email.com">
  </div>
  <script>document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('uid-input').value='qcY4lA6H2JWX2M6dtqIbK47AnYq2'; });</script>
  <button class="btn" onclick="setAdmin()">Configurar como administrador</button>
  <div class="log" id="log"><span class="info">Ingresá tu UID y presioná el botón.</span></div>
</div>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyC9LT9Yhz0Y8smqXJ0sAErLl4Lnf6s0rZ4",
  authDomain:        "repuestos-automotor.firebaseapp.com",
  projectId:         "repuestos-automotor",
  storageBucket:     "repuestos-automotor.firebasestorage.app",
  messagingSenderId: "952203469999",
  appId:             "1:952203469999:web:9d5ec956f834482172a05a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const log = (msg, type='info') => {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
};

window._ADMIN_UID = 'qcY4lA6H2JWX2M6dtqIbK47AnYq2';
window.setAdmin = async function() {
  const uid    = document.getElementById('uid-input').value.trim();
  const nombre = document.getElementById('nombre-input').value.trim();
  const email  = document.getElementById('email-input').value.trim();
  if (!uid)    { log('❌ Ingresá tu UID','err'); return; }
  if (!nombre) { log('❌ Ingresá tu nombre','err'); return; }
  if (!email)  { log('❌ Ingresá tu email','err'); return; }
  try {
    log('→ Creando perfil de administrador...','info');
    await setDoc(doc(db, 'usuarios', uid), {
      nombre_completo: nombre,
      email:           email,
      rol:             'admin',
      estado:          'activo',
      telefono:        '',
      empresa:         'Repuestos Electromecánicos',
      notas_admin:     '',
      fecha_registro:  serverTimestamp(),
      ultimo_acceso:   serverTimestamp(),
    });
    log(`✅ ¡Listo! ${nombre} configurado como ADMIN`, 'ok');
    log('Ahora podés abrir index.html e ingresar con tu email y contraseña', 'ok');
  } catch(e) {
    log(`❌ Error: ${e.message}`, 'err');
    log('Verificá que el Firestore esté activo en Firebase Console', 'err');
  }
};
</script>
</body>
</html>
