window.agregarCategorias = async function() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  try {
    // 1. Leer las que ya existen en Firestore
    log('→ Leyendo categorías existentes en Firestore...', 'info');
    const snap = await getDocs(collection(db, 'categorias'));
    const existentes = new Set();
    snap.forEach(d => {
      const n = d.data().nombre;
      if (n) existentes.add(n.trim());
    });
    log(`✓ Encontradas ${existentes.size} categorías existentes`, 'ok');

    // 2. Filtrar las que faltan
    const faltantes = TODAS.filter(c => !existentes.has(c));
    log(`→ Faltan agregar: ${faltantes.length} categorías`, faltantes.length > 0 ? 'warn' : 'ok');

    if (faltantes.length === 0) {
      log('✅ ¡Todo ya está actualizado! No hay nada que agregar.', 'ok');
      btn.textContent = '✅ Ya estaba actualizado';
      btn.style.background = '#22c55e';
      return;
    }

    // 3. Agregar las faltantes en batches de 450
    let idx = existentes.size; // orden empieza después de las existentes
    let agregadas = 0;
    for (let i = 0; i < faltantes.length; i += 450) {
      const chunk = faltantes.slice(i, i + 450);
      const batch = writeBatch(db);
      for (const cat of chunk) {
        const ref = doc(collection(db, 'categorias'));
        const partes = cat.split(' | ');
        batch.set(ref, {
          nombre:        cat,
          nombre_base:   partes[0],
          sub_categoria: partes[1] || '',
          activo:        true,
          orden:         idx++,
          aumento_x_cat: 0,
          imagen_url:    ''
        });
        agregadas++;
      }
      await batch.commit();
      log(`  → Batch guardado: ${Math.min(i + 450, faltantes.length)} / ${faltantes.length}`, 'info');
    }

    log(`✅ ¡Listo! Se agregaron ${agregadas} categorías nuevas.`, 'ok');
    log(`📊 Total en Firestore ahora: ${existentes.size + agregadas}`, 'ok');
    btn.textContent = `✅ ${agregadas} categorías agregadas`;
    btn.style.background = '#22c55e';

  } catch(e) {
    log(`❌ Error: ${e.message}`, 'err');
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'Reintentar';
  }
};
