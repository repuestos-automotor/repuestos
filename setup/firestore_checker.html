<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: monospace; background: #0f1117; color: #e2e8f0; padding: 20px; margin: 0; }
  h2 { color: #3b82f6; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 12px; margin-bottom: 20px; }
  .card { background: #1e2433; border: 1px solid #2a3347; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 13px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .col { background: #141720; border: 1px solid #2a3347; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .col-name { flex: 1; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .ok   { background: rgba(34,197,94,.2); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
  .err  { background: rgba(239,68,68,.2);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
  .warn { background: rgba(245,158,11,.2); color: #f59e0b; border: 1px solid rgba(245,158,11,.3); }
  .loading { color: #64748b; font-size: 12px; }
  button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; cursor: pointer; font-family: monospace; }
  button:hover { background: #2563eb; }
  .total { font-size: 11px; color: #64748b; margin-top: 4px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; background: #141720; border: 1px solid #2a3347; border-radius: 8px; padding: 8px 12px; color: #e2e8f0; font-family: monospace; font-size: 13px; outline: none; }
  input:focus { border-color: #3b82f6; }
  .results { margin-top: 8px; }
  #status { font-size: 12px; color: #f59e0b; margin-bottom: 12px; min-height: 18px; }
</style>
</head>
<body>
<h2>🔍 Verificador Firestore</h2>
<p class="sub">Busca en las 4 colecciones de tu proyecto repuestos-automotor</p>

<div class="search-row">
  <input id="q" placeholder="Escribí el nombre a buscar (ej: AAA, AaA, AbA...)" />
  <button onclick="buscar()">Buscar</button>
</div>
<button onclick="cargarTodo()" style="background:#1e2433;border:1px solid #2a3347;color:#94a3b8;margin-bottom:16px">Ver TODOS los docs de las 4 colecciones</button>

<div id="status"></div>
<div id="results"></div>

<script type="module">
const CONFIG = {
  apiKey: "AIzaSyC9LT9Yhz0Y8smqXJ0sAErLl4Lnf6s0rZ4",
  authDomain: "repuestos-automotor.firebaseapp.com",
  projectId: "repuestos-automotor",
  storageBucket: "repuestos-automotor.firebasestorage.app",
  messagingSenderId: "952203469999",
  appId: "1:952203469999:web:9d5ec956f834482172a05a"
};

const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
const { getFirestore, getDocs, collection } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

const apps = getApps();
const app = apps.find(a => a.name === 'checker') || initializeApp(CONFIG, 'checker');
const db = getFirestore(app);

const COLS = [
  { id: 'categorias',     label: '📁 Categorías',        campo: 'nombre' },
  { id: 'marcas_vehiculo',label: '🚗 Marcas Vehículo',   campo: 'nombre' },
  { id: 'marcas_repuesto',label: '🔧 Marcas Repuesto',   campo: 'nombre' },
  { id: 'proveedores',    label: '🏭 Proveedores',        campo: 'nombre' },
];

let _allDocs = null;

async function fetchAll() {
  if (_allDocs) return _allDocs;
  document.getElementById('status').textContent = 'Consultando Firestore...';
  const result = {};
  for (const col of COLS) {
    const snap = await getDocs(collection(db, col.id));
    result[col.id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  _allDocs = result;
  document.getElementById('status').textContent = '';
  return result;
}

window.buscar = async function() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (!q) { cargarTodo(); return; }
  const all = await fetchAll();
  let html = '';
  let totalEncontrados = 0;
  for (const col of COLS) {
    const docs = all[col.id];
    const encontrados = docs.filter(d => (d.nombre||d.id||'').toLowerCase().includes(q));
    totalEncontrados += encontrados.length;
    html += `<div class="card">
      <div class="card-title">${col.label} — ${docs.length} docs totales</div>`;
    if (encontrados.length === 0) {
      html += `<div style="color:#ef4444;font-size:12px">❌ No se encontró "${q}" en esta colección</div>`;
    } else {
      encontrados.forEach(d => {
        html += `<div class="row">
          <div class="col col-name">${d.nombre || d.id}</div>
          <div class="col" style="color:#64748b;font-size:10px">${d.id}</div>
          <span class="badge ok">✅ EXISTE</span>
        </div>`;
      });
    }
    html += `</div>`;
  }
  if (totalEncontrados === 0) {
    html = `<div class="card" style="border-color:#ef4444">
      <b style="color:#ef4444">❌ "${q}" NO existe en ninguna colección</b><br>
      <span style="color:#64748b;font-size:12px;margin-top:8px;display:block">El botón "Nueva categoría/marca/proveedor" no guardó en Firestore.</span>
    </div>` + html;
  }
  document.getElementById('results').innerHTML = html;
};

window.cargarTodo = async function() {
  const all = await fetchAll();
  let html = '';
  for (const col of COLS) {
    const docs = all[col.id].sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));
    html += `<div class="card">
      <div class="card-title">${col.label}</div>
      <div class="total">Total: ${docs.length} documentos</div>
      <div class="results" style="margin-top:8px;max-height:200px;overflow-y:auto">`;
    docs.forEach(d => {
      html += `<div class="row">
        <div class="col col-name">${d.nombre || '— sin nombre —'}</div>
        <div class="col" style="color:#64748b;font-size:10px">${d.id}</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('results').innerHTML = html;
};

// Enter para buscar
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

// Cargar todo al inicio
cargarTodo();
</script>
</body>
</html>
