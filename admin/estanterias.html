<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Estanterías</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--bg2:#0f1117;--bg3:#141720;--border:#1e2433;--border2:#2a3347;--text:#e2e8f0;--text2:#94a3b8;--text3:#4b5563;--blue:#3b82f6;--blue2:#2563eb;--blue-dim:#1e3a5f;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:16px;font-size:13px}
.page-title{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:13px;font-weight:500;color:var(--text2)}
.panel-body{padding:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:10.5px;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;color:var(--text);font-size:12.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--blue2)}
.btn{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-primary{background:var(--blue2);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-edit{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}.btn-edit:hover{background:var(--blue-dim)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg3)}
.item-row:last-child{border-bottom:none}
.item-name{flex:1;font-size:12.5px;color:var(--text)}
.item-actions{display:flex;gap:4px}
.empty{text-align:center;padding:20px;font-size:12px;color:var(--text3)}
.badge-orden{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--text3);min-width:30px;text-align:center}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;bottom:16px;right:16px;z-index:999}
.toast{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font-size:12px;margin-top:6px;animation:slideIn .2s ease}
.toast.ok{border-color:rgba(34,197,94,.4);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.4);color:var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page-title">⚡ Gestión de Estanterías y Estantes</div>

<div class="panel" style="margin-bottom:14px">
  <div class="panel-body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="descargarBackup()">💾 Descargar backup (.json)</button>
    <button class="btn btn-edit" onclick="document.getElementById('input-restaurar').click()">📤 Restaurar desde backup</button>
    <input type="file" id="input-restaurar" accept=".json" style="display:none" onchange="restaurarDesdeBackup(this.files[0])">
    <span style="font-size:11px;color:var(--text3)">Guardá el .json en tu PC o Drive. Si algún día esto vuelve a vaciarse, lo restaurás con "Restaurar desde backup" — nunca duplica.</span>
  </div>
</div>

<div class="grid2">
  <!-- ESTANTERÍAS -->
  <div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Estanterías</div>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">Nombre de la estantería</label>
          <input type="text" class="form-input" id="new-estanteria" placeholder="Ej: 6ta - Frente Izquierda">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="agregarEstanteria()">+ Agregar estantería</button>
        <div style="margin-top:14px" id="lista-estanterias"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- ESTANTES -->
  <div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Estantes (números)</div>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">Nombre / número del estante</label>
          <input type="text" class="form-input" id="new-estante" placeholder="Ej: 15, Sótano, Depósito">
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="agregarEstante()">+ Agregar estante</button>
        <div style="margin-top:14px" id="lista-estantes"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc, serverTimestamp, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyC9LT9Yhz0Y8smqXJ0sAErLl4Lnf6s0rZ4",
  authDomain:        "repuestos-automotor.firebaseapp.com",
  projectId:         "repuestos-automotor",
  storageBucket:     "repuestos-automotor.firebasestorage.app",
  messagingSenderId: "952203469999",
  appId:             "1:952203469999:web:9d5ec956f834482172a05a"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

function toast(msg, type='ok') {
  const w = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

// ── ESTANTERÍAS ───────────────────────────────────────
async function cargarEstanterias() {
  const el = document.getElementById('lista-estanterias');
  try {
    const snap = await getDocs(query(collection(db,'estanterias'), orderBy('orden')));
    const items = snap.docs.map(d=>({id:d.id,...d.data()}));
    if (!items.length) { el.innerHTML = '<div class="empty">Sin estanterías aún</div>'; return; }
    el.innerHTML = items.map(item=>`
      <div class="item-row" id="est-${item.id}">
        <span class="badge-orden">${item.orden||0}</span>
        <span class="item-name" id="name-est-${item.id}">${item.nombre}</span>
        <div class="item-actions">
          <button class="btn btn-edit btn-sm" onclick="editarEstanteria('${item.id}','${item.nombre.replace(/'/g,"\\'")}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="borrarEstanteria('${item.id}')">🗑️</button>
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty" style="color:var(--red)">❌ Error: ${e.message}</div>`;
  }
}

window.agregarEstanteria = async () => {
  const nombre = document.getElementById('new-estanteria').value.trim();
  if (!nombre) { toast('Ingresá un nombre','err'); return; }
  const snap = await getDocs(collection(db,'estanterias'));
  const orden = snap.size;
  await addDoc(collection(db,'estanterias'),{nombre, activo:true, orden, creado_en:serverTimestamp()});
  document.getElementById('new-estanteria').value = '';
  toast('✅ Estantería agregada');
  cargarEstanterias();
};

window.editarEstanteria = async (id, nombreActual) => {
  const nuevo = prompt('Nuevo nombre de la estantería:', nombreActual);
  if (!nuevo || nuevo===nombreActual) return;
  await updateDoc(doc(db,'estanterias',id),{nombre:nuevo});
  toast('✅ Estantería actualizada');
  cargarEstanterias();
};

window.borrarEstanteria = async (id) => {
  if (!confirm('¿Borrar esta estantería? Los repuestos asignados quedarán sin estantería.')) return;
  await deleteDoc(doc(db,'estanterias',id));
  toast('🗑️ Estantería eliminada');
  cargarEstanterias();
};

// ── ESTANTES ──────────────────────────────────────────
async function cargarEstantes() {
  const el = document.getElementById('lista-estantes');
  try {
    const snap = await getDocs(query(collection(db,'estantes'), orderBy('numero')));
    const items = snap.docs.map(d=>({id:d.id,...d.data()}));
    if (!items.length) { el.innerHTML = '<div class="empty">Sin estantes aún</div>'; return; }
    el.innerHTML = items.map(item=>`
      <div class="item-row" id="estan-${item.id}">
        <span class="badge-orden">${item.numero||0}</span>
        <span class="item-name">${item.nombre}</span>
        <div class="item-actions">
          <button class="btn btn-edit btn-sm" onclick="editarEstante('${item.id}','${item.nombre.replace(/'/g,"\\'")}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="borrarEstante('${item.id}')">🗑️</button>
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty" style="color:var(--red)">❌ Error: ${e.message}</div>`;
  }
}

window.agregarEstante = async () => {
  const nombre = document.getElementById('new-estante').value.trim();
  if (!nombre) { toast('Ingresá un nombre','err'); return; }
  const snap = await getDocs(collection(db,'estantes'));
  const numero = isNaN(nombre) ? snap.size + 100 : parseInt(nombre);
  await addDoc(collection(db,'estantes'),{nombre, numero, activo:true, creado_en:serverTimestamp()});
  document.getElementById('new-estante').value = '';
  toast('✅ Estante agregado');
  cargarEstantes();
};

window.editarEstante = async (id, nombreActual) => {
  const nuevo = prompt('Nuevo nombre del estante:', nombreActual);
  if (!nuevo || nuevo===nombreActual) return;
  await updateDoc(doc(db,'estantes',id),{nombre:nuevo});
  toast('✅ Estante actualizado');
  cargarEstantes();
};

window.borrarEstante = async (id) => {
  if (!confirm('¿Borrar este estante?')) return;
  await deleteDoc(doc(db,'estantes',id));
  toast('🗑️ Estante eliminado');
  cargarEstantes();
};

// ── BACKUP ────────────────────────────────────────────
window.descargarBackup = async () => {
  const [snapEst, snapEstan] = await Promise.all([
    getDocs(collection(db,'estanterias')),
    getDocs(collection(db,'estantes'))
  ]);
  const backup = {
    fecha: new Date().toISOString(),
    estanterias: snapEst.docs.map(d => d.data()),
    estantes: snapEstan.docs.map(d => d.data())
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-estanterias-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('💾 Backup descargado');
};

// Restaura desde un .json descargado con "Descargar backup". Solo AGREGA lo que falte
// (comparando por nombre) — nunca borra ni duplica lo que ya está.
window.restaurarDesdeBackup = async (file) => {
  if (!file) return;
  try {
    const backup = JSON.parse(await file.text());
    const norm = s => String(s||'').trim().toLowerCase();

    const [snapEst, snapEstan] = await Promise.all([
      getDocs(collection(db,'estanterias')),
      getDocs(collection(db,'estantes'))
    ]);
    const existentesEst = new Set(snapEst.docs.map(d => norm(d.data().nombre)));
    const existentesEstan = new Set(snapEstan.docs.map(d => norm(d.data().nombre)));

    let agregadas = 0, agregados = 0;
    for (const item of (backup.estanterias||[])) {
      if (existentesEst.has(norm(item.nombre))) continue;
      await addDoc(collection(db,'estanterias'), item);
      agregadas++;
    }
    for (const item of (backup.estantes||[])) {
      if (existentesEstan.has(norm(item.nombre))) continue;
      await addDoc(collection(db,'estantes'), item);
      agregados++;
    }
    toast(`✅ Restauradas ${agregadas} estanterías y ${agregados} estantes que faltaban`);
    cargarEstanterias();
    cargarEstantes();
  } catch(e) {
    toast('❌ Error leyendo el backup: ' + e.message, 'err');
  } finally {
    document.getElementById('input-restaurar').value = '';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    cargarEstanterias();
    cargarEstantes();
  } else {
    document.getElementById('lista-estanterias').innerHTML = '<div class="empty" style="color:var(--red)">❌ No hay sesión activa. Iniciá sesión en admin/index.html primero.</div>';
    document.getElementById('lista-estantes').innerHTML = '<div class="empty" style="color:var(--red)">❌ No hay sesión activa. Iniciá sesión en admin/index.html primero.</div>';
  }
});
</script>
</body>
</html>
